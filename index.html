<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/logoprofile.png">
    <title>Spideychill | Links</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para los iconos de redes sociales y música -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <!-- Avatar / Foto de perfil -->
    <div class="profile-container">
        <img src="assets/img/logoprofile.png" alt="Spideychill Avatar" class="avatar">
    </div>

    <!-- Nombre y Bio -->
    <h1 class="username">Spideychill</h1>
    <p class="bio">I'm a cool and chill guy who enjoys meeting people everyday!</p>

    <!-- Lista de enlaces / Botones -->
    <div class="links-list">
        <a href="https://github.com/vianadaniel-dev" target="_blank" class="link-button">
            <i class="fa-brands fa-github"></i> GitHub
        </a>

        <a href="https://instagram.com/spidey.chill" target="_blank" class="link-button">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>

        <a href="https://tiktok.com/@spidey.chill_" target="_blank" class="link-button">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <a href="https://x.com/vianadanieldev" target="_blank" class="link-button">
            <i class="fa-brands fa-x-twitter"></i> X (Twitter)
        </a>

        <a href="https://www.linkedin.com/in/vianadaniel-dev/" target="_blank" class="link-button">
            <i class="fa-brands fa-linkedin-in"></i> LinkedIn
        </a>
    </div>

    <!-- Pie de página -->
    <footer class="footer">
        <p>© 2026 Spideychill. All rights reserved.</p>
    </footer>
</div>

<!-- Reproductor de música de fondo (Oculto) -->
<audio id="bg-music" loop>
    <source src="assets/audio/IntroSong.mp3" type="audio/mp3">
    Tu navegador no soporta audio.
</audio>

<!-- Contenedor flotante de música y volumen -->
<div class="music-control-container">
    <!-- Botón de Play/Pause -->
    <button id="music-btn" class="music-float-btn" onclick="toggleMusic()" title="Reproducir / Pausar">
        <i id="music-icon" class="fa-solid fa-volume-xmark"></i>
    </button>

    <!-- Barra deslizante de volumen -->
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.5" onchange="setVolume(this.value)" oninput="setVolume(this.value)" title="Ajustar volumen">
</div>

<!-- Script para controlar la música -->
<script>
    const music = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-btn');
    const musicIcon = document.getElementById('music-icon');
    const volumeSlider = document.getElementById('volume-slider');

    // Establecer un volumen inicial por defecto (ej. 40%)
    music.volume = volumeSlider.value;

    function toggleMusic() {
        if (music.paused) {
            music.play();
            musicIcon.classList.remove('fa-volume-xmark');
            musicIcon.classList.add('fa-volume-high');
        } else {
            music.pause();
            musicIcon.classList.remove('fa-volume-high');
            musicIcon.classList.add('fa-volume-xmark');
        }
    }

    function setVolume(value) {
        music.volume = value;
        // Cambiar el icono dinámicamente si el volumen baja a 0
        if (value == 0) {
            musicIcon.classList.remove('fa-volume-high', 'fa-volume-low');
            musicIcon.classList.add('fa-volume-xmark');
        } else {
            musicIcon.classList.remove('fa-volume-xmark');
            musicIcon.classList.add('fa-volume-high');
        }
    }
</script>

</body>
</html>
